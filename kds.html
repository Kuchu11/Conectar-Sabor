<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta Sabor - KDS Cozinha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0b0b0d] text-[#e5e1e4] p-4 min-h-screen flex flex-col font-['DM_Sans']">

  <header class="bg-[#18181c] border border-[#2e2e38] rounded-2xl p-4 mb-4 flex flex-wrap justify-between items-center gap-3 shadow-lg">
    <div class="flex items-center gap-3">
      <span class="text-3xl text-[#ea580c]">🔥</span>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-display font-bold text-lg text-white tracking-wide">FOGO & BRASA KDS</h1>
          <span class="text-[11px] bg-[#10b981]/20 text-[#10b981] font-bold px-2 py-0.5 rounded-full border border-[#10b981]/30">● ONLINE</span>
          <span class="font-display text-xs text-[#a1a1aa] ml-2" id="kds-relogio">--:--:--</span>
        </div>
        <p class="text-xs text-[#a1a1aa]">Terminal de Operação da Grelha e Cozinha</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="adicionarPedidoExemplo('mock')" class="px-3 py-2 bg-[#26262f] hover:bg-[#32323d] text-[#e5e1e4] rounded-xl text-xs font-bold border border-[#3c4a42]">
        + Simular Pedido
      </button>
      <div class="bg-[#121214] border border-[#2e2e38] px-3 py-2 rounded-xl flex items-center gap-3 text-xs font-display">
        <span class="text-[#ea580c] font-bold">Novos: <strong id="kds-badge-novos" class="text-white text-sm">0</strong></span>
        <span class="text-[#f59e0b] font-bold">Preparo: <strong id="kds-badge-preparo" class="text-white text-sm">0</strong></span>
        <span class="text-[#10b981] font-bold">Prontos: <strong id="kds-badge-prontos" class="text-white text-sm">0</strong></span>
      </div>
      <a href="index.html" class="px-3 py-2 bg-[#10b981] hover:bg-[#059669] text-[#003824] rounded-xl text-xs font-bold transition-colors">Voltar ao PDV</a>
    </div>
  </header>

  <div class="flex gap-2 mb-3">
    <button onclick="filtrarEstacao('todos', this)" class="kds-filter px-3 py-1 rounded-full text-xs font-bold bg-[#ea580c] text-white">Todos os Pedidos</button>
    <button onclick="filtrarEstacao('churrasqueira', this)" class="kds-filter px-3 py-1 rounded-full text-xs font-bold bg-[#1e1e24] text-[#a1a1aa] border border-[#2e2e38]">🥩 Parrilla & Carnes</button>
    <button onclick="filtrarEstacao('cozinha', this)" class="kds-filter px-3 py-1 rounded-full text-xs font-bold bg-[#1e1e24] text-[#a1a1aa] border border-[#2e2e38]">🍚 Cozinha Quente</button>
  </div>

  <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-[#121214] border border-[#2e2e38] rounded-2xl p-3 flex flex-col min-h-[500px]">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2e2e38]">
        <h2 class="font-display font-bold text-xs uppercase tracking-wide text-[#ea580c] flex items-center gap-1.5">
          <span>🔥 Novos Pedidos</span>
        </h2>
        <span id="col-count-novos" class="text-xs font-bold px-2 py-0.5 bg-[#ea580c]/20 text-[#ea580c] rounded-full">0</span>
      </div>
      <div id="lista-novos" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1"></div>
    </div>

    <div class="bg-[#121214] border border-[#2e2e38] rounded-2xl p-3 flex flex-col min-h-[500px]">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2e2e38]">
        <h2 class="font-display font-bold text-xs uppercase tracking-wide text-[#f59e0b] flex items-center gap-1.5">
          <span>⏳ Em Preparo / Na Brasa</span>
        </h2>
        <span id="col-count-preparo" class="text-xs font-bold px-2 py-0.5 bg-[#f59e0b]/20 text-[#f59e0b] rounded-full">0</span>
      </div>
      <div id="lista-preparo" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1"></div>
    </div>

    <div class="bg-[#121214] border border-[#2e2e38] rounded-2xl p-3 flex flex-col min-h-[500px]">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2e2e38]">
        <h2 class="font-display font-bold text-xs uppercase tracking-wide text-[#10b981] flex items-center gap-1.5">
          <span>✅ Prontos / Expedição</span>
        </h2>
        <span id="col-count-prontos" class="text-xs font-bold px-2 py-0.5 bg-[#10b981]/20 text-[#10b981] rounded-full">0</span>
      </div>
      <div id="lista-prontos" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script>
    let estacaoAtiva = 'todos';

    function inicializarPedidosMock(chave) {
      const dados = localStorage.getItem('pedidos_kds_data');
      if (!dados || JSON.parse(dados).length === 0) {
        const mockInicial = [
          {
            id: 101,
            mesa: "Mesa 12",
            origem: "Tablet Churrasqueira #01",
            horario: "19:35",
            tempoDecorrido: "08:14 min",
            status: "novos",
            observacao: "SEM CEBOLA NA FAROFA",
            itens: [
              { nome: "Picanha na Brasa 500g", quantidade: 1, ponto: "Ao Ponto" },
              { nome: "Queijo Coalho c/ Melaço", quantidade: 2, ponto: "" },
              { nome: "Farofa Especial Bacon", quantidade: 1, ponto: "" }
            ]
          },
          {
            id: 102,
            mesa: "Mesa 04",
            origem: "App Mobile Cliente",
            horario: "19:28",
            tempoDecorrido: "15:40 min",
            status: "preparo",
            observacao: "CARNE BEM PASSADA",
            itens: [
              { nome: "Maminha Manteiga 400g", quantidade: 1, ponto: "Bem Passada" },
              { nome: "Cerveja IPA 500ml", quantidade: 2, ponto: "" }
            ]
          },
          {
            id: 103,
            mesa: "Balcão",
            origem: "PDV Balcão",
            horario: "19:20",
            tempoDecorrido: "22:10 min",
            status: "prontos",
            observacao: "",
            itens: [
              { nome: "Picanha na Brasa 500g", quantidade: 1, ponto: "Mal Passada" }
            ]
          }
        ];
        localStorage.setItem('pedidos_kds_data', JSON.stringify(mockInicial));
      }
    }

    function carregarPedidosKds(origem) {
      const storageDados = localStorage.getItem('pedidos_kds_data');
      return storageDados ? JSON.parse(storageDados) : [];
    }

    function salvarPedidosKds(pedidosAtualizados) {
      localStorage.setItem('pedidos_kds_data', JSON.stringify(pedidosAtualizados));
      renderizarTelaKds('renderizar');
    }

    function alterarStatusKds(idPedido, statusAlvo) {
      let pedidos = carregarPedidosKds('status');
      if (statusAlvo === 'finalizado') {
        pedidos = pedidos.filter(function(item) { return item.id !== idPedido; });
      } else {
        pedidos = pedidos.map(function(item) {
          if (item.id === idPedido) {
            item.status = statusAlvo;
          }
          return item;
        });
      }
      salvarPedidosKds(pedidos);
    }

    function adicionarPedidoExemplo(origemChamada) {
      let pedidos = carregarPedidosKds('adicionar');
      const novoMock = {
        id: Date.now(),
        mesa: "Mesa 08",
        origem: "Tablet Churrasqueira #01",
        horario: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }),
        tempoDecorrido: "00:30 min",
        status: "novos",
        observacao: "PONTO DA PICANHA BEM VERMELHO",
        itens: [
          { nome: "Picanha na Brasa 500g", quantidade: 1, ponto: "Mal Passada" },
          { nome: "Farofa de Bacon", quantidade: 1, ponto: "" },
          { nome: "Cerveja IPA Puro Malte", quantidade: 2, ponto: "" }
        ]
      };
      pedidos.unshift(novoMock);
      salvarPedidosKds(pedidos);
    }

    function filtrarEstacao(tipo, botaoClicado) {
      estacaoAtiva = tipo;
      document.querySelectorAll('.kds-filter').forEach(function(btn) {
        btn.className = "kds-filter px-3 py-1 rounded-full text-xs font-bold bg-[#1e1e24] text-[#a1a1aa] border border-[#2e2e38]";
      });
      botaoClicado.className = "kds-filter px-3 py-1 rounded-full text-xs font-bold bg-[#ea580c] text-white";
      renderizarTelaKds('filtro');
    }

    function renderizarTelaKds(acao) {
      const pedidos = carregarPedidosKds('render');
      const containerNovos = document.getElementById('lista-novos');
      const containerPreparo = document.getElementById('lista-preparo');
      const containerProntos = document.getElementById('lista-prontos');

      containerNovos.innerHTML = '';
      containerPreparo.innerHTML = '';
      containerProntos.innerHTML = '';

      let cNovos = 0;
      let cPreparo = 0;
      let cProntos = 0;

      pedidos.forEach(function(pedido) {
        const card = document.createElement('div');
        card.className = "bg-[#18181c] border border-[#2e2e38] rounded-xl p-3 flex flex-col justify-between shadow-lg transition-all";

        let listaItens = pedido.itens.map(function(item) {
          let badgePonto = item.ponto ? `<span class="text-[9px] bg-[#ea580c]/20 text-[#ea580c] px-1.5 py-0.5 rounded font-bold uppercase tracking-wider ml-1">⦿ ${item.ponto}</span>` : '';
          return `
            <li class="text-xs text-white flex justify-between items-center py-1 border-b border-[#26262f]/80">
              <span class="flex items-center"><strong class="text-[#10b981] font-display text-sm mr-2">${item.quantidade}x</strong> ${item.nome}</span>
              ${badgePonto}
            </li>
          `;
        }).join('');

        let tagObservacao = pedido.observacao ? `
          <div class="mt-2 p-1.5 bg-[#93000a]/20 border border-[#ffb4ab]/30 rounded-lg text-[10px] text-[#ffb4ab] font-bold flex items-center gap-1 uppercase">
            <span>⚠️</span> ${pedido.observacao}
          </div>
        ` : '';

        let badgeOrigem = pedido.origem ? `<span class="text-[9px] bg-[#26262f] text-[#bbcabf] px-1.5 py-0.5 rounded border border-[#3c4a42]">${pedido.origem}</span>` : '';

        if (pedido.status === 'novos') {
          cNovos++;
          card.classList.add('border-l-4', 'border-l-[#ea580c]');
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2 pb-1.5 border-b border-[#2e2e38]">
                <div>
                  <h3 class="font-display font-bold text-base text-white">${pedido.mesa}</h3>
                  ${badgeOrigem}
                </div>
                <div class="text-right">
                  <span class="text-[10px] text-[#ea580c] font-bold block font-display">⏱️ ${pedido.tempoDecorrido || pedido.horario}</span>
                  <span class="text-[9px] text-[#71717a]">Entrada: ${pedido.horario}</span>
                </div>
              </div>
              <ul class="flex flex-col gap-0.5 mb-2">${listaItens}</ul>
              ${tagObservacao}
            </div>
            <button onclick="alterarStatusKds(${pedido.id}, 'preparo')" class="w-full mt-3 py-2 bg-[#ea580c] hover:bg-[#c2410c] text-white font-bold text-xs rounded-lg uppercase font-display tracking-wider active:scale-98 transition-transform">
              🔥 Iniciar Grelha
            </button>
          `;
          containerNovos.appendChild(card);
        } else if (pedido.status === 'preparo') {
          cPreparo++;
          card.classList.add('border-l-4', 'border-l-[#f59e0b]');
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2 pb-1.5 border-b border-[#2e2e38]">
                <div>
                  <h3 class="font-display font-bold text-base text-white">${pedido.mesa}</h3>
                  ${badgeOrigem}
                </div>
                <div class="text-right">
                  <span class="text-[10px] text-[#f59e0b] font-bold block font-display">⏳ Na Grelha</span>
                  <span class="text-[9px] text-[#71717a]">Entrada: ${pedido.horario}</span>
                </div>
              </div>
              <ul class="flex flex-col gap-0.5 mb-2">${listaItens}</ul>
              ${tagObservacao}
            </div>
            <button onclick="alterarStatusKds(${pedido.id}, 'prontos')" class="w-full mt-3 py-2 bg-[#10b981] hover:bg-[#059669] text-[#003824] font-bold text-xs rounded-lg uppercase font-display tracking-wider active:scale-98 transition-transform">
              ✅ Pronto p/ Servir
            </button>
          `;
          containerPreparo.appendChild(card);
        } else if (pedido.status === 'prontos') {
          cProntos++;
          card.classList.add('border-l-4', 'border-l-[#10b981]', 'opacity-90');
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2 pb-1.5 border-b border-[#2e2e38]">
                <div>
                  <h3 class="font-display font-bold text-base text-white">${pedido.mesa}</h3>
                  ${badgeOrigem}
                </div>
                <span class="text-[10px] text-[#10b981] font-bold font-display uppercase bg-[#10b981]/10 px-2 py-0.5 rounded">Pronto</span>
              </div>
              <ul class="flex flex-col gap-0.5 mb-2">${listaItens}</ul>
            </div>
            <button onclick="alterarStatusKds(${pedido.id}, 'finalizado')" class="w-full mt-2 py-1.5 bg-[#26262f] hover:bg-[#32323d] text-[#a1a1aa] hover:text-white font-bold text-[11px] rounded-lg uppercase transition-colors">
              Arquivar Pedido
            </button>
          `;
          containerProntos.appendChild(card);
        }
      });

      document.getElementById('col-count-novos').innerText = cNovos;
      document.getElementById('col-count-preparo').innerText = cPreparo;
      document.getElementById('col-count-prontos').innerText = cProntos;
      document.getElementById('kds-badge-novos').innerText = cNovos;
      document.getElementById('kds-badge-preparo').innerText = cPreparo;
      document.getElementById('kds-badge-prontos').innerText = cProntos;
    }

    function atualizarRelogio(acao) {
      const elemento = document.getElementById('kds-relogio');
      if (elemento) {
        elemento.innerText = new Date().toLocaleTimeString('pt-BR');
      }
    }

    window.addEventListener('storage', function(evento) {
      if (evento.key === 'pedidos_kds_data') {
        renderizarTelaKds('storage');
      }
    });

    inicializarPedidosMock('iniciar');
    renderizarTelaKds('inicial');
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio('agora');
  </script>
</body>
</html>
