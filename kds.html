<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta Sabor - KDS Cozinha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0b0b0d] text-[#e5e1e4] p-4 min-h-screen flex flex-col font-['DM_Sans']">

  <header class="bg-[#18181c] border border-[#2e2e38] rounded-2xl p-4 mb-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <span class="text-3xl text-[#ea580c]">🔥</span>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-display font-bold text-lg text-white tracking-wide">FOGO & BRASA KDS</h1>
          <span class="text-[11px] bg-[#10b981]/20 text-[#10b981] font-bold px-2 py-0.5 rounded-full border border-[#10b981]/30">● ONLINE</span>
        </div>
        <p class="text-xs text-[#a1a1aa]">Terminal Industrial de Expedição</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="bg-[#121214] border border-[#2e2e38] px-4 py-2 rounded-xl flex items-center gap-4 text-xs font-display">
        <span class="text-[#ea580c] font-bold">Novos: <strong id="kds-badge-novos" class="text-white text-sm">0</strong></span>
        <span class="text-[#f59e0b] font-bold">Preparo: <strong id="kds-badge-preparo" class="text-white text-sm">0</strong></span>
        <span class="text-[#10b981] font-bold">Prontos: <strong id="kds-badge-prontos" class="text-white text-sm">0</strong></span>
      </div>
      <a href="index.html" class="px-3 py-2 bg-[#26262f] hover:bg-[#32323d] text-white rounded-xl text-xs font-bold transition-colors">Voltar ao PDV</a>
    </div>
  </header>

  <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-[#121214] border border-[#2e2e38] rounded-2xl p-3 flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2e2e38]">
        <h2 class="font-display font-bold text-xs uppercase tracking-wide text-[#ea580c] flex items-center gap-1.5">
          <span>🔥 Novos Pedidos</span>
        </h2>
        <span id="col-count-novos" class="text-xs font-bold px-2 py-0.5 bg-[#ea580c]/20 text-[#ea580c] rounded-full">0</span>
      </div>
      <div id="lista-novos" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1"></div>
    </div>

    <div class="bg-[#121214] border border-[#2e2e38] rounded-2xl p-3 flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2e2e38]">
        <h2 class="font-display font-bold text-xs uppercase tracking-wide text-[#f59e0b] flex items-center gap-1.5">
          <span>⏳ Em Preparo / Grelha</span>
        </h2>
        <span id="col-count-preparo" class="text-xs font-bold px-2 py-0.5 bg-[#f59e0b]/20 text-[#f59e0b] rounded-full">0</span>
      </div>
      <div id="lista-preparo" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1"></div>
    </div>

    <div class="bg-[#121214] border border-[#2e2e38] rounded-2xl p-3 flex flex-col">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-[#2e2e38]">
        <h2 class="font-display font-bold text-xs uppercase tracking-wide text-[#10b981] flex items-center gap-1.5">
          <span>✅ Prontos / Expedição</span>
        </h2>
        <span id="col-count-prontos" class="text-xs font-bold px-2 py-0.5 bg-[#10b981]/20 text-[#10b981] rounded-full">0</span>
      </div>
      <div id="lista-prontos" class="flex-1 flex flex-col gap-3 overflow-y-auto pr-1"></div>
    </div>
  </main>

  <script>
    function carregarPedidosKds(origem) {
      const storageDados = localStorage.getItem('pedidos_kds_data');
      return storageDados ? JSON.parse(storageDados) : [];
    }

    function salvarPedidosKds(pedidosAtualizados) {
      localStorage.setItem('pedidos_kds_data', JSON.stringify(pedidosAtualizados));
      renderizarTelaKds('renderizar');
    }

    function alterarStatusKds(idPedido, statusAlvo) {
      let pedidos = carregarPedidosKds('status');
      pedidos = pedidos.map(function(item) {
        if (item.id === idPedido) {
          item.status = statusAlvo;
        }
        return item;
      });
      salvarPedidosKds(pedidos);
    }

    function renderizarTelaKds(acao) {
      const pedidos = carregarPedidosKds('render');
      const containerNovos = document.getElementById('lista-novos');
      const containerPreparo = document.getElementById('lista-preparo');
      const containerProntos = document.getElementById('lista-prontos');

      containerNovos.innerHTML = '';
      containerPreparo.innerHTML = '';
      containerProntos.innerHTML = '';

      let cNovos = 0;
      let cPreparo = 0;
      let cProntos = 0;

      pedidos.forEach(function(pedido) {
        const card = document.createElement('div');
        card.className = "bg-[#18181c] border border-[#2e2e38] rounded-xl p-3 flex flex-col justify-between shadow-md transition-all";

        let listaItens = pedido.itens.map(function(item) {
          let badgePonto = item.ponto ? `<span class="text-[9px] bg-[#ea580c]/20 text-[#ea580c] px-1 rounded ml-1 font-bold">${item.ponto}</span>` : '';
          return `
            <li class="text-xs text-white flex justify-between items-center py-0.5 border-b border-[#26262f]">
              <span><strong>${item.quantidade}x</strong> ${item.nome} ${badgePonto}</span>
            </li>
          `;
        }).join('');

        if (pedido.status === 'novos') {
          cNovos++;
          card.classList.add('border-l-4', 'border-l-[#ea580c]');
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-2 pb-1 border-b border-[#2e2e38]">
                <span class="font-display font-bold text-sm text-white">${pedido.mesa}</span>
                <span class="text-[10px] text-[#ea580c] font-bold">⏱️ ${pedido.horario}</span>
              </div>
              <ul class="flex flex-col gap-1 mb-3">${listaItens}</ul>
            </div>
            <button onclick="alterarStatusKds(${pedido.id}, 'preparo')" class="w-full py-2 bg-[#ea580c] hover:bg-[#c2410c] text-white font-bold text-xs rounded-lg uppercase tracking-wide active:scale-98 transition-transform">
              Iniciar Preparo
            </button>
          `;
          containerNovos.appendChild(card);
        } else if (pedido.status === 'preparo') {
          cPreparo++;
          card.classList.add('border-l-4', 'border-l-[#f59e0b]');
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-2 pb-1 border-b border-[#2e2e38]">
                <span class="font-display font-bold text-sm text-white">${pedido.mesa}</span>
                <span class="text-[10px] text-[#f59e0b] font-bold">Na Grelha</span>
              </div>
              <ul class="flex flex-col gap-1 mb-3">${listaItens}</ul>
            </div>
            <button onclick="alterarStatusKds(${pedido.id}, 'prontos')" class="w-full py-2 bg-[#10b981] hover:bg-[#059669] text-[#003824] font-bold text-xs rounded-lg uppercase tracking-wide active:scale-98 transition-transform">
              Pronto p/ Servir
            </button>
          `;
          containerPreparo.appendChild(card);
        } else if (pedido.status === 'prontos') {
          cProntos++;
          card.classList.add('border-l-4', 'border-l-[#10b981]', 'opacity-85');
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-center mb-2 pb-1 border-b border-[#2e2e38]">
                <span class="font-display font-bold text-sm text-white">${pedido.mesa}</span>
                <span class="text-[10px] text-[#10b981] font-bold">Expedido</span>
              </div>
              <ul class="flex flex-col gap-1 mb-2">${listaItens}</ul>
            </div>
            <button onclick="alterarStatusKds(${pedido.id}, 'finalizado')" class="w-full py-1 bg-[#26262f] hover:bg-[#32323d] text-[#a1a1aa] font-bold text-[10px] rounded uppercase">
              Arquivar
            </button>
          `;
          containerProntos.appendChild(card);
        }
      });

      document.getElementById('col-count-novos').innerText = cNovos;
      document.getElementById('col-count-preparo').innerText = cPreparo;
      document.getElementById('col-count-prontos').innerText = cProntos;
      document.getElementById('kds-badge-novos').innerText = cNovos;
      document.getElementById('kds-badge-preparo').innerText = cPreparo;
      document.getElementById('kds-badge-prontos').innerText = cProntos;
    }

    window.addEventListener('storage', function(evento) {
      if (evento.key === 'pedidos_kds_data') {
        renderizarTelaKds('storage');
      }
    });

    renderizarTelaKds('inicial');
  </script>
</body>
</html>
